<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Promptly Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-3">
  <h1>Admin Panel</h1>
  <div id="unauth" class="alert alert-danger" style="display:none;">Access denied</div>
  <div id="content" style="display:none;">
    <h2>Sessions</h2>
    <button id="create-session" class="btn btn-primary mb-2">Create Session</button>
    <ul id="sessions"></ul>
    <h2>Authorized Users</h2>
    <form id="add-user" class="mb-3">
      <input id="new-username" class="form-control mb-1" placeholder="GitHub username">
      <select id="new-role" class="form-select mb-1">
        <option value="professor">Professor</option>
        <option value="ta">TA</option>
      </select>
      <button class="btn btn-success" type="submit">Add/Update User</button>
    </form>
    <table class="table" id="user-table"></table>
  </div>
  <script src="admin.js"></script>
</body>
</html>
